name: 🎬 Build Jazz Cinema APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v11.0.1)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🔑 Generate signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using provided keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating fresh self-signed keystore..."
            keytool -genkey -v \
              -keystore android/app/keystore.jks \
              -alias jazz_cinema \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass jazzcinema2024 \
              -keypass jazzcinema2024 \
              -dname "CN=Jazz Cinema Pro, OU=Mobile, O=JazzCinema, L=Lahore, ST=Punjab, C=PK"
            echo "STORE_PASSWORD=jazzcinema2024" >> $GITHUB_ENV
            echo "KEY_ALIAS=jazz_cinema" >> $GITHUB_ENV
            echo "KEY_PASSWORD=jazzcinema2024" >> $GITHUB_ENV
          fi

      - name: 🔧 Configure signing in gradle
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ env.STORE_PASSWORD }}
          keyPassword=${{ env.KEY_PASSWORD }}
          keyAlias=${{ env.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: 🏗️ Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: 🗜️ Build universal APK
        run: flutter build apk --release

      - name: 📋 Get version info
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v${VERSION}-build${TIMESTAMP}"; fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jazz-cinema-apk-${{ steps.version.outputs.timestamp }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "🎬 Jazz Cinema Pro ${{ steps.version.outputs.version }} (${{ steps.version.outputs.timestamp }})"
          body: |
            ## 🎬 Jazz Cinema Pro v${{ steps.version.outputs.version }}

            ### 📥 Download APK
            | File | Architecture | Recommended for |
            |------|-------------|-----------------|
            | `app-release.apk` | Universal | Most devices |
            | `app-arm64-v8a-release.apk` | ARM64 | Modern phones (2017+) |
            | `app-armeabi-v7a-release.apk` | ARMv7 | Older phones |

            ### ✨ What's in v11 (Flutter)
            - 🎨 Beautiful Material 3 dark UI with 5 themes
            - 🎬 Movies, Series, Live TV, Shorts, Songs
            - 📥 Download support
            - 🔐 Key activation system (4 movies/day trial)
            - 🌙 Glassmorphism design

            ### 📲 How to Install
            1. Download `app-release.apk`
            2. On your Android phone: **Settings → Security → Install unknown apps**
            3. Open the downloaded APK and install

            > Built automatically from commit `${{ github.sha }}`
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
