name: jazz_cinema
description: Jazz Cinema Pro v11 — Beautiful Flutter movie streaming app
publish_to: 'none'
version: 11.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Network & HTTP (dio was unused and caused startup crashes on old Android)
  http: ^1.2.1

  # Database (pure-Dart MySQL — no native code, safe on all Android versions)
  mysql_client: ^0.0.27

  # Video playback
  video_player: ^2.9.1
  chewie: ^1.8.5

  # Image caching
  cached_network_image: ^3.4.1

  # Local storage
  shared_preferences: ^2.3.2

  # UI / Animations
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Pin to 8.x — v9.x has a Gradle compatibility issue with AGP 8.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/valid_keys.txt
